framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    default_locale: fr
    csrf_protection: true
    # Fonctionnalités activées explicitement (ne dépend pas de l'auto-détection)
    assets: true
    form: true
    validation: true
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['fr']
    session:
        cookie_secure: auto
        cookie_samesite: lax
    php_errors:
        log: true
    http_client:
        scoped_clients:
            off.client:
                base_uri: '%env(OFF_BASE_URI)%'
                timeout: 5
                max_duration: 8
                headers:
                    User-Agent: 'RestoManager/1.0 (PFE challenge EMC)'
                    Accept: 'application/json'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
