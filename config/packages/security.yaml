security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
                always_use_default_target_path: true
            logout:
                path: app_logout
                target: app_login

    # Le gérant hérite des droits du serveur et de la cuisine.
    role_hierarchy:
        ROLE_MANAGER: [ROLE_SERVER, ROLE_KITCHEN]

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/carte, roles: PUBLIC_ACCESS }
        - { path: ^/(admin|dashboard), roles: ROLE_MANAGER }
        - { path: ^/kitchen, roles: ROLE_KITCHEN }
        - { path: ^/service, roles: ROLE_SERVER }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
